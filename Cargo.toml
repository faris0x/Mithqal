[package]
name = "mithqal"
version = "0.0.2"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
description = "A symbolic math engine"
repository = "https://github.com/faris0x/Mithqal"
homepage = "https://github.com/faris0x/Mithqal"
publish = false

[features]
default = ["std", "cli"]
std = ["mithqalite/std"]
cli = ["std", "dep:rustyline"]
gui = []

[dependencies]
rustyline = { version = "19", optional = true }
mithqalite = { path = "vendor/mithqalite/mithqalite", default-features = false, features = ["naturals_and_integers", "rationals", "floats"] }
hashbrown = { version = "0.16.1", default-features = false, features = ["default-hasher", "inline-more"] }
libm = "0.2.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "bench"
harness = false
