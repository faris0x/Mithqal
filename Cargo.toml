[package]
name = "mithqal"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "A symbolic math engine"
repository = "https://github.com/faris0x/Mithqal"
homepage = "https://github.com/faris0x/Mithqal"
publish = false

[features]
default = ["cli"]
cli = ["dep:rustyline"]
gui = []

[dependencies]
rustyline = { version = "19", optional = true }
malachite = { path = "vendor/mithqalite/malachite", default-features = false, features = ["std", "naturals_and_integers", "rationals", "floats"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "bench"
harness = false
