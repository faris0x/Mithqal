name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MITHQAL_PROPERTY_CASES: 128

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mithqal-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'build.rs', 'vendor/gmp/**', 'vendor/mpfr/**', 'vendor/mpc/**') }}
          restore-keys: |
            ${{ runner.os }}-mithqal-${{ steps.toolchain.outputs.cachekey }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Build library without default features
        run: cargo build --locked --no-default-features --lib

      - name: Check documentation claims
        run: sh scripts/check-docs.sh

      - name: Report test counts
        run: sh scripts/test-counts.sh

      - name: Run debug tests
        run: cargo test --locked

      - name: Run release tests
        run: cargo test --release --locked

      - name: Build documentation
        run: cargo doc --no-deps --locked

      - name: Run documentation tests
        run: cargo test --doc --locked

      - name: Compile benchmarks
        run: cargo bench --no-run --locked

      - name: Report cache size
        if: always()
        run: du -sh target ~/.cargo
