name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MITHQAL_PROPERTY_CASES: 128

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,thumbv7m-none-eabi

      - name: Cache Cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mithqal-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.gitmodules', 'vendor/mithqalite/**') }}
          restore-keys: |
            ${{ runner.os }}-mithqal-${{ steps.toolchain.outputs.cachekey }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Build library without default features
        run: cargo build --locked --no-default-features --lib

      - name: Check no_std host build
        run: cargo check --locked --no-default-features --lib

      - name: Check no_std wasm32
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --lib

      - name: Check no_std thumbv7m
        run: cargo check --locked --target thumbv7m-none-eabi --no-default-features --lib

      - name: Check Mithqalite no_std
        run: |
          cargo check --manifest-path vendor/mithqalite/Cargo.toml -p mithqalite-float --lib --no-default-features
          cargo check --manifest-path vendor/mithqalite/Cargo.toml -p mithqalite --lib --no-default-features --features naturals_and_integers,rationals,floats

      - name: Check version consistency
        run: sh scripts/check-versions.sh

      - name: Check documentation claims
        run: sh scripts/check-docs.sh

      - name: Report test counts
        run: sh scripts/test-counts.sh

      - name: Run debug tests
        run: cargo test --locked

      - name: Run release tests
        run: cargo test --release --locked

      - name: Build documentation
        run: cargo doc --no-deps --locked

      - name: Run documentation tests
        run: cargo test --doc --locked

      - name: Compile benchmarks
        run: cargo bench --no-run --locked

      - name: Report cache size
        if: always()
        run: du -sh target ~/.cargo
